<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1220; }
  body { font-family: "Segoe UI", Arial, sans-serif; color: #f1f5f9; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  .scene { position: absolute; inset: 0; display: none; padding: 120px 80px; }
  h1 { font-size: 110px; line-height: 1.05; letter-spacing: -1px; }
  h1 .accent { color: #2dd4bf; }
  p.sub { font-size: 44px; color: #cbd5e1; margin-top: 28px; }
  #bar-wrap { position: absolute; left: 80px; right: 80px; bottom: 220px; height: 56px;
    background: #1e293b; border-radius: 28px; overflow: hidden; }
  #bar { height: 100%; width: 0%; background: #2dd4bf; border-radius: 28px; }
  #bar-label { position: absolute; left: 80px; bottom: 300px; font-size: 40px; color: #cbd5e1; }
  #endcard { align-items: center; justify-content: center; text-align: center; }
  #endcard .big { font-size: 96px; font-weight: 700; }
</style>
</head>
<body>
<div id="stage">
  <section class="scene" id="s1">
    <h1>Your title<br><span class="accent">goes here</span></h1>
    <p class="sub">One short supporting line.</p>
  </section>
  <section class="scene" id="s2">
    <div id="bar-label">Progress is drawn from t, never played</div>
    <div id="bar-wrap"><div id="bar"></div></div>
  </section>
  <section class="scene" id="s3">
    <div id="endcard-inner">
      <div class="big">The End</div>
      <p class="sub">your handle or call to action</p>
    </div>
  </section>
</div>
<script>
  // Easing helpers: pure functions of progress p in [0, 1].
  const clamp01 = (p) => Math.min(1, Math.max(0, p));
  const easeOut = (p) => 1 - Math.pow(1 - clamp01(p), 3);
  const easeInOut = (p) => { p = clamp01(p); return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; };
  const seg = (t, from, to) => clamp01((t - from) / (to - from)); // progress of t inside [from, to]

  const $ = (id) => document.getElementById(id);

  // Scene table: cumulative durations in seconds. Total must equal the
  // --duration you pass to render.mjs.
  const SCENES = [
    { id: 's1', dur: 3.0, draw(t) {
        // Title slides up and fades in during the first 0.8 s.
        const p = easeOut(seg(t, 0, 0.8));
        const el = $('s1');
        el.style.opacity = p;
        el.style.transform = `translateY(${(1 - p) * 60}px)`;
      } },
    { id: 's2', dur: 3.0, draw(t) {
        // A bar grows across the whole scene.
        $('bar').style.width = (easeInOut(seg(t, 0.2, 2.8)) * 100).toFixed(2) + '%';
        $('bar-label').style.opacity = easeOut(seg(t, 0, 0.5));
      } },
    { id: 's3', dur: 1.5, draw(t) {
        const p = easeOut(seg(t, 0, 0.6));
        const el = $('s3');
        el.style.opacity = p;
        el.style.transform = `scale(${0.92 + 0.08 * p})`;
      } },
  ];

  const total = SCENES.reduce((a, s) => a + s.dur, 0);
  window.__duration = total;

  // The contract: draw the exact frame for time t (seconds).
  window.seek = function (t) {
    let acc = 0;
    for (const s of SCENES) {
      const el = $(s.id);
      if (t < acc + s.dur || s === SCENES[SCENES.length - 1]) {
        el.style.display = s.id === 's3' ? 'flex' : 'block';
        s.draw(t - acc);
      } else {
        el.style.display = 'none';
      }
      acc += s.dur;
    }
  };

  window.seek(0);
</script>
</body>
</html>
