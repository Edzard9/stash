<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title Card - Big Type</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#020617; font-family: system-ui, "Segoe UI", Arial, sans-serif; }
  .card { width:1080px; height:1920px; background:#0f172a; color:#f8fafc;
          display:flex; flex-direction:column; justify-content:center; padding:90px; }
  .kicker { font-size:34px; letter-spacing:6px; font-weight:700; color:#38bdf8; text-transform:uppercase; margin-bottom:36px; }
  h1 { font-size:238px; line-height:.98; font-weight:900; letter-spacing:-2px; }
  h1 .accent { color:#38bdf8; }
  h1 .accent2 { color:#fb923c; }
  .foot { margin-top:56px; font-size:36px; color:#94a3b8; font-weight:600; }
</style>
</head>
<body>
<div class="card">
  <div class="kicker">Networking basics</div>
  <h1>WHAT<br>IS A<br><span class="accent">VLAN</span><span class="accent2">?</span></h1>
  <div class="foot">The title is the picture: three words, one accent colour, nothing else competing.</div>
</div>
</body>
</html>
