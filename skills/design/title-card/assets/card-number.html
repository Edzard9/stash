<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title Card - Big Number</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#020617; font-family: system-ui, "Segoe UI", Arial, sans-serif; }
  .card { width:1080px; height:1920px; background:#0f172a; color:#f8fafc;
          display:flex; flex-direction:column; align-items:center; justify-content:center; padding:90px; }
  .kicker { font-size:34px; letter-spacing:6px; font-weight:700; color:#94a3b8; text-transform:uppercase; }
  .num { font-size:900px; line-height:1; font-weight:900; color:#38bdf8; margin:10px 0; }
  .unit { font-size:64px; font-weight:800; text-align:center; line-height:1.25; }
  .foot { margin-top:48px; font-size:36px; color:#94a3b8; font-weight:600; text-align:center; line-height:1.4; }
</style>
</head>
<body>
<div class="card">
  <div class="kicker">One switch</div>
  <div class="num">2</div>
  <div class="unit">separate networks<br>on the same hardware</div>
  <div class="foot">The number is the hook: it fills the frame,<br>and the words just explain it.</div>
</div>
</body>
</html>
