<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title Card - Diagram</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#020617; font-family: system-ui, "Segoe UI", Arial, sans-serif; }
  .card { width:1080px; height:1920px; background:#0f172a; color:#f8fafc;
          display:flex; flex-direction:column; align-items:center; padding:110px 80px; }
  .kicker { font-size:34px; letter-spacing:6px; font-weight:700; color:#38bdf8; text-transform:uppercase; }
  h1 { font-size:150px; line-height:1.02; font-weight:900; text-align:center; margin-top:30px; }
  h1 .accent { color:#38bdf8; }
  .diagram { margin-top:90px; }
  .sub { margin-top:80px; font-size:42px; line-height:1.35; color:#cbd5e1; text-align:center; font-weight:600; }
  .sub b.a { color:#38bdf8; } .sub b.b { color:#fb923c; }
</style>
</head>
<body>
<div class="card">
  <div class="kicker">Networking basics</div>
  <h1>What is a <span class="accent">VLAN</span>?</h1>
  <svg class="diagram" width="860" height="620" viewBox="0 0 860 620">
    <!-- cables -->
    <line x1="215" y1="330" x2="380" y2="170" stroke="#64748b" stroke-width="7"/>
    <line x1="330" y1="330" x2="410" y2="170" stroke="#64748b" stroke-width="7"/>
    <line x1="530" y1="330" x2="450" y2="170" stroke="#64748b" stroke-width="7"/>
    <line x1="645" y1="330" x2="480" y2="170" stroke="#64748b" stroke-width="7"/>
    <!-- switch -->
    <rect x="270" y="95" width="320" height="80" rx="16" fill="#1d4ed8" stroke="#93c5fd" stroke-width="4"/>
    <text x="430" y="148" fill="#eff6ff" font-size="38" font-weight="700" text-anchor="middle">SWITCH</text>
    <!-- PCs -->
    <g>
      <rect x="130" y="330" width="170" height="115" rx="14" fill="#334155" stroke="#38bdf8" stroke-width="6"/>
      <text x="215" y="400" fill="#e2e8f0" font-size="34" font-weight="700" text-anchor="middle">PC-A</text>
      <rect x="315" y="330" width="170" height="115" rx="14" fill="#334155" stroke="#38bdf8" stroke-width="6"/>
      <text x="400" y="400" fill="#e2e8f0" font-size="34" font-weight="700" text-anchor="middle">PC-B</text>
      <rect x="500" y="330" width="170" height="115" rx="14" fill="#334155" stroke="#fb923c" stroke-width="6"/>
      <text x="585" y="400" fill="#e2e8f0" font-size="34" font-weight="700" text-anchor="middle">PC-C</text>
      <rect x="685" y="330" width="170" height="115" rx="14" fill="#334155" stroke="#fb923c" stroke-width="6"/>
      <text x="770" y="400" fill="#e2e8f0" font-size="34" font-weight="700" text-anchor="middle">PC-D</text>
    </g>
    <text x="307" y="505" fill="#38bdf8" font-size="34" font-weight="700" text-anchor="middle">VLAN 10</text>
    <text x="677" y="505" fill="#fb923c" font-size="34" font-weight="700" text-anchor="middle">VLAN 20</text>
    <text x="430" y="580" fill="#94a3b8" font-size="30" text-anchor="middle">One switch, two separate networks</text>
  </svg>
  <div class="sub"><b class="a">Blue</b> can only talk to <b class="a">blue</b>.<br><b class="b">Orange</b> can only talk to <b class="b">orange</b>.</div>
</div>
</body>
</html>
